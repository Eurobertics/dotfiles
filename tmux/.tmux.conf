# ~/.tmux.conf
# Einfache Basis-Konfig — gut zum Reinkommen

# ── Prefix ────────────────────────────────────────────────────────────────────
# Ctrl+b ist der Default und bleibt so erstmal.
# Wer später wechseln will: Ctrl+Space ist angenehm
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix


# ── Terminal & Farben ─────────────────────────────────────────────────────────
# Wichtig für Neovim: True Color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,tmux-256color:RGB"

# Escape-Delay auf 0 — sonst reagiert Neovim träge auf ESC
set -sg escape-time 0


# ── Allgemeines ───────────────────────────────────────────────────────────────
# Windows und Panes ab 1 nummerieren (nicht ab 0 — ergonomischer auf Tastatur)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Automatisch umnummerieren wenn ein Window geschlossen wird
set -g renumber-windows on

# Maus aktivieren (Scrolling, Pane-Klick, Resize)
set -g mouse on

# Scrollback Buffer — mehr History
set -g history-limit 10000


# ── Keybindings ───────────────────────────────────────────────────────────────
# Config neu laden ohne tmux-Neustart
bind r source-file ~/.tmux.conf \; display "Config neu geladen!"

# Intuitivere Splits: | für vertikal, - für horizontal
# Außerdem: aktuelles Verzeichnis im neuen Pane beibehalten
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Neues Window im aktuellen Verzeichnis
bind c new-window -c "#{pane_current_path}"

# Zwischen Panes mit Vim-Bewegungen wechseln
bind k select-pane -U
bind l select-pane -R


# ── Status Bar ────────────────────────────────────────────────────────────────
set -g status-position bottom
set -g status-interval 5

set -g status-style "bg=#e8e4d9,fg=#5c5848"
set -g status-left "#[fg=#5a7a4a,bold] #S #[fg=#5c5848,nobold]│ "
set -g status-right "#[fg=#5c5848] %H:%M "

# Windows
set -g window-status-style "fg=#8c8472"
set -g window-status-current-style "fg=#5a7a4a,bold"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "

# Pane Borders
set -g pane-border-style "fg=#d0cbbf"
set -g pane-active-border-style "fg=#5a7a4a"


# ── Copy Mode (Vim-Style) ─────────────────────────────────────────────────────
# Vi-Keybindings im Scroll/Copy-Modus
set-window-option -g mode-keys vi

# Prefix+[ zum Starten, dann wie in Vim navigieren
# v zum Markieren, y zum Kopieren
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
